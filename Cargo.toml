[package]
name = "metro-calculator"
version = "1.0.0"
edition = "2021"
description = "Metro-style calculator rendered with Skia, written in 100% safe Rust (zero unsafe blocks)"
license = "MIT"

[dependencies]
# Skia (Google) rendering — GPU-accelerated (OpenGL backend) first, CPU raster as fallback
skia-safe = { version = "0.157.0", features = ["gl"] }
# Windowing & events (cross-platform)
winit = "0.30.13"
# OpenGL context creation (Skia GPU backend)
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
# Present Skia bitmaps to the window (Windows GDI / X11 / Wayland / macOS)
softbuffer = "0.4.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
